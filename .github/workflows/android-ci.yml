name: Android CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Test and Build Debug
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace

      - name: Run Android Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Debug App Bundle (AAB)
        run: ./gradlew bundleDebug --stacktrace

      - name: Upload Test Reports
        if: failure()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: test-reports-debug
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 3

      - name: Upload Lint Report
        if: failure()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: lint-report-debug
          path: app/build/reports/lint-results-debug.html
          retention-days: 3

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: android-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 3

      - name: Upload Debug App Bundle (AAB)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: android-debug-aab
          path: app/build/outputs/bundle/debug/*.aab
          retention-days: 3
